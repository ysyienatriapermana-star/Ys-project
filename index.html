
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">

<title>YS Project</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
  color: #111;
}

header {
  text-align: center;
  padding: 15px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  color: #777;
  font-size: 13px;
}

.kartu {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  margin-top: 15px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 18px;
  cursor: pointer;
  transition: 0.2s;
}

.kartu:active {
  transform: scale(0.98);
}

.kartu img {
  width: 55px;
  height: 55px;
  border-radius: 13px;
  object-fit: cover;
}

.info {
  flex: 1;
}

.info strong {
  font-size: 16px;
}

.info p {
  margin: 5px 0 0;
  color: #777;
  font-size: 12px;
}

.panah {
  font-size: 22px;
  color: #888;
}

#panelLanjut {
  display: none;
  margin-top: 20px;
  padding: 18px;
  background: white;
  border-radius: 18px;
  border: 1px solid #ddd;
}

#panelLanjut h3 {
  margin-top: 0;
}

#tombolLanjut {
  display: block;
  width: 100%;
  padding: 15px;
  background: #087cf0;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#tombolLanjut:active {
  background: #0560bb;
}

#status {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
}

footer {
  text-align: center;
  margin-top: 40px;
  color: #888;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>YS Project</h1>
  <p>Platform aplikasi YS Project</p>
</header>

<!-- KARTU APLIKASI -->
<div class="kartu" onclick="mulaiIklan()">

  <img src="ic_launcher.png" alt="Siaran TV Life">

  <div class="info">
    <strong>Siaran TV Life</strong>
    <p>Game Simulator Siaran Televisi</p>
  </div>

  <div class="panah">›</div>

</div>

<!-- PANEL LANJUT -->
<div id="panelLanjut">

  <h3>Siaran TV Life</h3>

  <p id="status">
    Halaman iklan telah dibuka.
    Kamu bisa kembali ke aplikasi ini dan melanjutkan.
  </p>

  <button id="tombolLanjut" onclick="bukaAplikasi()">
    Buka Siaran TV Life
  </button>

</div>

<footer>
  © 2026 YS Project
</footer>

<script>

// LINK IKLAN
const linkIklan =
"https://ardance.org/4/187f06b9228b38cb0887bee7d9540743";

// LINK GOOGLE DRIVE
const linkAplikasi =
"https://drive.google.com/file/d/12tibmLwd-ITP0X87PjSvG1T-IGREkOLp/view?usp=drivesdk";

// MEMBUKA HALAMAN IKLAN
function mulaiIklan() {

  // Buka halaman iklan pada tab baru
  const tabIklan = window.open(linkIklan, "_blank");

  // Tampilkan tombol lanjut
  document.getElementById("panelLanjut").style.display =
  "block";

  // Informasi jika browser memblokir tab baru
  if (!tabIklan) {
    document.getElementById("status").innerText =
    "Browser memblokir tab iklan. Izinkan pembukaan tab baru jika ingin membuka halaman tersebut.";
  }

}

// MEMBUKA APLIKASI
function bukaAplikasi() {

  window.location.href = linkAplikasi;

}

</script>

</body>
</html>
